[project]
name = "tracker"
version = "0.1.0"
description = "Personal job-application tracker — updatable from web UI and via CLI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlmodel>=0.0.16",
    "typer>=0.12",
    "python-multipart>=0.0.9",  # UploadFile / multipart form parsing for resume upload
]

[project.scripts]
tracker = "tracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracker"]
